[package]
name = "omit-windows"
version = "2.0.0"
description = "Omit — Featherlight System-Wide Ad, Tracker & Anti-DPI Shield for Windows 10/11"
authors = ["Omit"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking"] }
