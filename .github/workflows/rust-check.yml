name: Rust type check (diagnostic)

on:
  push:
    branches: ["arena/**"]
    paths: ["desktop-windows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-windows/src-tauri -> target"

      - name: Prepare frontend + resources
        shell: pwsh
        run: |
          cd ui-web
          npm ci
          npm run build
          cd ../desktop-windows
          npm install

      - name: cargo check (report errors as a commit comment)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          cd desktop-windows/src-tauri
          $out = (cargo check --message-format short 2>&1 | Out-String)
          $out | Write-Host
          $sha = "${{ github.sha }}"
          $body = "cargo check output for $sha`n`n" + ($out.Substring(0, [Math]::Min(60000, $out.Length)))
          $payload = @{ body = $body } | ConvertTo-Json -Depth 5
          $headers = @{
            Authorization = "Bearer ${{ github.token }}"
            Accept = "application/vnd.github+json"
          }
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/${{ github.repository }}/commits/$sha/comments" `
            -Headers $headers -Body $payload -ContentType "application/json"
