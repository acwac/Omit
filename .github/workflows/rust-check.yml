name: Rust check

# Temporary diagnostic: surfaces cargo errors as a commit comment, because
# Actions logs and run artifacts are not readable from every environment.
on:
  push:
    paths:
      - "desktop-windows/src-tauri/**"
      - ".github/workflows/rust-check.yml"
  workflow_dispatch:

jobs:
  cargo-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-windows/src-tauri -> target"
      - name: cargo check
        shell: pwsh
        run: |
          cd desktop-windows/src-tauri
          cargo check --message-format short 2>&1 | Out-File -FilePath check.log -Encoding utf8
          if ($LASTEXITCODE -ne 0) { $failed = "1" } else { $failed = "0" }
          "exit=$failed" | Out-File -Append -FilePath check.log -Encoding utf8
          $body = Get-Content check.log -Raw
          if ($body.Length -gt 60000) { $body = $body.Substring($body.Length - 60000) }
          $payload = @{ body = "cargo check``````n$body``````" } | ConvertTo-Json
          Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" `
            -Method Post -Headers @{ Authorization = "token ${{ github.token }}"; Accept = "application/vnd.github+json" } `
            -Body $payload -ContentType "application/json"
          if ($failed -eq "1") { exit 1 }
