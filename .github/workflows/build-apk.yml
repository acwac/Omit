name: Build Omit

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34 & Build Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Kotlin 1.9.24
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -o /tmp/kotlin.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          sudo mv /opt/kotlinc /opt/kotlin

      - name: Compile Blocklists (omit_starter.vbin)
        run: python3 scripts/compile_blocklists.py

      - name: Build Web UI
        run: |
          cd ui-web
          npm ci
          npm run build

      - name: Build Omit APK
        run: |
          chmod +x scripts/build_apk.sh
          mkdir -p dist-release
          ANDROID_SDK_ROOT="$ANDROID_HOME" KOTLIN_HOME="/opt/kotlin" ./scripts/build_apk.sh ./dist-release/Omit.apk

      - name: Upload Omit.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omit-apk
          path: dist-release/Omit.apk

  build-windows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Compile Blocklists (omit_starter.vbin)
        run: python scripts/compile_blocklists.py

      - name: Build Web UI
        run: |
          cd ui-web
          npm ci
          npm run build

      - name: Build Omit-Windows.exe
        shell: pwsh
        run: |
          cd desktop-windows
          npm install
          npx tauri build
          New-Item -ItemType Directory -Force -Path ../dist-windows | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName ../dist-windows/Omit-Windows.exe
          } else {
            Copy-Item "src-tauri/target/release/omit-windows.exe" ../dist-windows/Omit-Windows.exe
          }

      - name: Upload Omit-Windows.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omit-windows
          path: dist-windows/Omit-Windows.exe

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Omit-apk
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: Omit-windows
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Omit v2.0.0
          files: |
            release-assets/Omit.apk
            release-assets/Omit-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
