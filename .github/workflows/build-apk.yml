name: Build Vellum APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui-web/package-lock.json

      - name: Build UI bundle into Android assets
        working-directory: ui-web
        run: |
          npm ci
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK & Kotlin 1.9.24
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip" -o /tmp/kotlin.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          sudo mv /opt/kotlinc /opt/kotlin

      - name: Build & Sign Vellum.apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          KOTLIN_HOME: /opt/kotlin
        run: |
          chmod +x scripts/build_apk.sh
          ./scripts/build_apk.sh ./Vellum.apk

      - name: Upload Vellum.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vellum-APK
          path: ./Vellum.apk
