name: Build Omit

on:
  push:
    branches: [ "main", "arena/**" ]
    paths-ignore: [ "downloads/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Android SDK 34 & Build Tools
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          yes | "$SDKMGR" --licenses || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Kotlin 1.9.24
        run: |
          curl -fsSL https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -o /tmp/kotlin.zip
          sudo unzip -q /tmp/kotlin.zip -d /opt
          sudo mv /opt/kotlinc /opt/kotlin

      - name: Compile Blocklists (omit_starter.vbin)
        run: python3 scripts/compile_blocklists.py

      - name: Build Web UI
        run: |
          cd ui-web
          npm ci
          npm run build

      - name: Build Omit APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x scripts/build_apk.sh
          mkdir -p dist-release
          # A throwaway key produces an APK that no existing install can update.
          # Once the stable key is in place, set REQUIRE_STABLE_SIGNING=1 in this
          # file so publishing is blocked if the secret ever goes missing again.
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            export ALLOW_EPHEMERAL_KEY=1
            echo "::warning title=Unsigned identity::No ANDROID_KEYSTORE_BASE64 secret; this APK cannot update an existing install."
            if [ "${REQUIRE_STABLE_SIGNING:-0}" = "1" ] && [ "${{ github.event_name }}" = "push" ]; then
              echo "::error title=Refusing to publish::Add ANDROID_KEYSTORE_BASE64 and RELEASE_CERT_SHA256 so every install shares one signing key. Without them no release can be updated in place."
              exit 1
            fi
          fi
          ANDROID_SDK_ROOT="$ANDROID_HOME" KOTLIN_HOME="/opt/kotlin" ./scripts/build_apk.sh ./dist-release/Omit.apk

      - name: Upload Omit.apk Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Omit-apk
          path: dist-release/

  build-windows:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop-windows/src-tauri -> target"

      - name: Compile Blocklists (omit_starter.vbin)
        run: python scripts/compile_blocklists.py

      - name: Build Web UI
        run: |
          cd ui-web
          npm ci
          npm run build

      - name: Build Omit-Windows.exe
        shell: pwsh
        run: |
          cd desktop-windows
          npm install
          npx tauri build
          New-Item -ItemType Directory -Force -Path ../dist-windows | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/release/bundle/nsis/*.exe","src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsis) {
            throw "NSIS installer was not produced. Check the tauri build output."
          }
          Copy-Item $nsis.FullName ../dist-windows/Omit-Windows.exe
          Get-Item ../dist-windows/Omit-Windows.exe | Select-Object Name, Length

      - name: Upload Omit-Windows.exe Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Omit-windows
          path: dist-windows/Omit-Windows.exe

  publish-downloads:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [build-android, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          name: Omit-apk
          path: downloads

      - uses: actions/download-artifact@v8
        with:
          name: Omit-windows
          path: downloads

      - name: Package ota-ui.zip
        run: |
          mkdir -p downloads
          # Recreated from scratch (zip -r would merge into an existing archive and
          # keep shipping every older bundle's hashed assets) with fixed timestamps
          # so the bytes, and therefore the published SHA-256, are reproducible.
          rm -f downloads/ota-ui.zip
          python3 scripts/pack_ota.py app/src/main/assets/ui downloads/ota-ui.zip

      - name: Verify signing identity
        env:
          EXPECTED_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          CERT=$(unzip -p downloads/Omit.apk 'META-INF/*.RSA' 2>/dev/null | openssl pkcs7 -inform DER -print_certs 2>/dev/null | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2)
          echo "APK certificate SHA-256: ${CERT:-unknown}"
          if [ -n "$EXPECTED_SHA256" ]; then
            if [ "$CERT" != "$EXPECTED_SHA256" ]; then
              echo "::error title=Signing identity changed::The APK certificate does not match RELEASE_CERT_SHA256. Existing installs could not update."
              exit 1
            fi
            echo "Certificate matches the pinned release identity."
          else
            echo "::warning title=No pinned certificate::Set RELEASE_CERT_SHA256 to enforce a stable signing identity."
          fi

      - name: Commit & Push Website Downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/pack_ota.py --write-version app/src/main/assets/ui downloads/ota-ui.zip version.json
          git add downloads/Omit.apk downloads/ota-ui.zip downloads/Omit-Windows.exe version.json
          git commit -m "chore: update website downloads Omit.apk and Omit-Windows.exe [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
          git push --force origin HEAD:refs/heads/main
